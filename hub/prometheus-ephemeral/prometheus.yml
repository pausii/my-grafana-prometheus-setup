# ============================================================
# Second Prometheus — ephemeral servers only (push / remote_write)
# ============================================================
# Note there is NO scrape_config for the ephemeral servers. Their
# data arrives on its own via /api/v1/write. Prometheus acts as a
# receiver here, not a fetcher.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'monitoring-ephemeral'

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # The only thing it scrapes is itself.
  - job_name: 'prometheus-ephemeral'
    static_configs:
      - targets: ['127.0.0.1:9091']
        labels:
          server: 'de-fsn-01'
