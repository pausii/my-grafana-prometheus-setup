# ============================================================
# /etc/nginx/conf.d/push-log-format.conf
# ============================================================
# Every request to the push endpoint arrives through the CDN, so
# $remote_addr is always a CDN address — useless for answering
# "which server sent this?".
#
# Cloudflare puts the real client address in the CF-Connecting-IP
# header. This log format records it, which is the only way to
# identify an unexpected pusher.
#
# Reading it back:
#   awk '{print $1}' /var/log/nginx/push-access.log \
#     | grep -v '^2400:cb00' | sort | uniq -c | sort -rn
#
# log_format is only valid in the http context, not inside
# server{} — hence this separate file.
log_format push_log '$http_cf_connecting_ip $remote_addr '
                    '[$time_local] "$request" $status $body_bytes_sent '
                    'user=$remote_user';
