# ============================================================
# Alert rules for the fixed servers
# ============================================================
# The important part of this file is `for:`.
#
# An alert has three states:
#   inactive  the expression is false
#   pending   the expression became true, but not yet for `for:`
#   firing    it has been true continuously for `for:`
#
# Without `for:`, a 15-second CPU spike during a backup is enough
# to page you. After a few days people start ignoring those
# alerts — and an ignored alert is exactly as useful as no alert.
#
# Rule of thumb: the faster a problem gets worse, the shorter the
# `for:`.
#
# A NOTE ON AGGREGATION
# These rules use `without(cpu, mode)` rather than `by(instance)`.
# Both average across all cores, but:
#   by(instance)        keeps ONLY the instance label
#   without(cpu, mode)  drops those two, KEEPS everything else
# The annotations below reference $labels.city and
# $labels.provider, so those labels have to survive aggregation.
# `without` also keeps the rules correct if labels are added later.

groups:

  - name: availability
    rules:

      - alert: ServerDown
        # `up` is generated by Prometheus itself, not sent by
        # node_exporter — which is precisely why it still exists
        # when the server is completely dead.
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.server }} is not responding"
          description: >-
            Prometheus has failed to scrape {{ $labels.server }}
            ({{ $labels.city }}, {{ $labels.provider }},
            {{ $labels.runtime }}) for more than 2 minutes. Check the
            host, the network, and the firewall rules.

      - alert: SlowScrape
        # Early warning: once scrape duration approaches
        # scrape_timeout (10s), the target is about to go DOWN.
        expr: scrape_duration_seconds{job="node"} > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Scraping {{ $labels.server }} is slowing down"
          description: >-
            Took {{ $value | printf "%.1f" }}s against a 10s timeout.
            Either the host is loaded or the path to
            {{ $labels.city }} is degraded.

  - name: resources
    rules:

      - alert: HighCpu
        expr: >-
          100 - (avg without(cpu, mode) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])) * 100) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU on {{ $labels.server }} above 85%"
          description: >-
            Averaging {{ $value | printf "%.0f" }}% over the last 15
            minutes in {{ $labels.city }}. Short spikes do not trigger
            this.

      - alert: LowMemory
        expr: >-
          100 * (1 - node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Memory on {{ $labels.server }} at {{ $value | printf \"%.0f\" }}%"
          description: >-
            Based on MemAvailable, not MemFree. On Linux MemFree is
            misleading: it counts reclaimable page cache as used, so
            it looks alarming when nothing is wrong.

      - alert: OomKill
        # increase() over a counter: the kernel killed something for
        # running out of memory. This is an event, not a threshold,
        # so `for:` is as short as practical.
        expr: increase(node_vmstat_oom_kill{job="node"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kernel OOM-killed a process on {{ $labels.server }}"
          description: >-
            {{ $value | printf "%.0f" }} time(s) in the last 10
            minutes.

  - name: storage
    rules:

      - alert: DiskFillingUp
        expr: >-
          100 - (node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay|squashfs"} * 100) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.server }} is {{ $value | printf \"%.0f\" }}% full"
          description: >-
            tmpfs and overlay are excluded because they are not real
            storage — overlay is the container filesystem layer.

      - alert: DiskWillFillIn24h
        # The most valuable kind of alert: it tells you BEFORE the
        # problem happens.
        # predict_linear fits a straight line through the last 6
        # hours and asks "what will this be in 24 hours?". Below
        # zero means the disk is on track to fill before then.
        expr: >-
          predict_linear(node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
          and
          node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay|squashfs"} > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.server }} projected full within 24h"
          description: >-
            Based on the growth rate over the last 6 hours in
            {{ $labels.city }}. `for: 1h` keeps a transient spike —
            a large download that is then deleted — from firing it.
