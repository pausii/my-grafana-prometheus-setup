# ============================================================
# NODE via Docker — node_exporter only
#   docker compose up -d
# ============================================================

services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped

    # host networking is REQUIRED here. With "ports: 9100:9100",
    # Docker opens the port to the entire internet by bypassing
    # UFW — its iptables rules are evaluated before UFW's. With
    # host networking, UFW decides who gets in.
    network_mode: host
    pid: host

    volumes:
      - /:/host:ro,rslave

    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/.+)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$'
      # Comes from .env — the one thing that differs per host.
      # See .env.example for how to choose it.
      #
      # If LISTEN_ADDR names a private address whose interface is
      # not up yet when Docker starts, the container fails to bind
      # and "restart: unless-stopped" retries until it is. That is
      # the intended behaviour.
      - '--web.listen-address=${LISTEN_ADDR:?set LISTEN_ADDR in .env}'
